<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b1a" />
    <meta name="description" content="A polished, dependency-free falling-block puzzle game." />
    <title>Neon Stack</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">ARCADE SYSTEM // ONLINE</p>
          <h1>NEON <span>STACK</span></h1>
        </div>
        <div class="top-actions">
          <button id="pauseButton" class="icon-button" type="button" aria-label="Pause game" title="Pause (P)">
            <span aria-hidden="true">Ⅱ</span>
          </button>
          <button id="muteButton" class="icon-button" type="button" aria-label="Mute sound" title="Mute sound">
            <span aria-hidden="true">♪</span>
          </button>
          <button id="restartButton" class="text-button" type="button">NEW GAME</button>
        </div>
      </header>

      <section class="game-layout" aria-label="Neon Stack game">
        <aside class="left-rail">
          <section class="panel hold-panel">
            <div class="panel-heading"><span>HOLD</span><kbd>C</kbd></div>
            <div id="holdPiece" class="mini-piece empty" aria-label="No held piece"></div>
          </section>

          <section class="panel stats-panel" aria-label="Game statistics">
            <div class="stat primary-stat">
              <span>SCORE</span>
              <strong id="scoreValue">000000</strong>
            </div>
            <div class="stat-row">
              <div class="stat"><span>LEVEL</span><strong id="levelValue">01</strong></div>
              <div class="stat"><span>LINES</span><strong id="linesValue">000</strong></div>
            </div>
          </section>

          <section class="panel keyboard-help">
            <div class="panel-heading"><span>KEYS</span></div>
            <dl>
              <div><dt><kbd>←</kbd><kbd>→</kbd></dt><dd>Move</dd></div>
              <div><dt><kbd>↑</kbd> / <kbd>X</kbd></dt><dd>Rotate</dd></div>
              <div><dt><kbd>Z</kbd></dt><dd>Rotate back</dd></div>
              <div><dt><kbd>↓</kbd></dt><dd>Soft drop</dd></div>
              <div><dt><kbd>Space</kbd></dt><dd>Hard drop</dd></div>
              <div><dt><kbd>C</kbd></dt><dd>Hold</dd></div>
            </dl>
          </section>
        </aside>

        <section id="boardFrame" class="board-frame">
          <div class="board-chrome" aria-hidden="true">
            <span class="corner top-left"></span><span class="corner top-right"></span>
            <span class="corner bottom-left"></span><span class="corner bottom-right"></span>
          </div>
          <canvas id="gameCanvas" width="320" height="640" aria-label="Tetris game board" role="img"></canvas>
          <div id="statusOverlay" class="status-overlay" hidden>
            <p id="statusKicker" class="eyebrow">SYSTEM PAUSED</p>
            <h2 id="statusTitle">PAUSED</h2>
            <p id="statusMessage">Press P or tap resume</p>
            <button id="overlayButton" class="text-button bright" type="button">RESUME</button>
          </div>
        </section>

        <aside class="right-rail">
          <section class="panel next-panel">
            <div class="panel-heading"><span>NEXT</span><span class="queue-mark">QUEUE 05</span></div>
            <div id="nextQueue" class="next-queue" aria-label="Upcoming pieces"></div>
          </section>
        </aside>
      </section>

      <section class="touch-controls panel" aria-label="On-screen game controls">
        <div class="control-cluster movement-controls">
          <button type="button" data-action="left" data-repeat aria-label="Move left"><span>←</span><small>LEFT</small></button>
          <button type="button" data-action="soft" data-repeat aria-label="Soft drop"><span>↓</span><small>DOWN</small></button>
          <button type="button" data-action="right" data-repeat aria-label="Move right"><span>→</span><small>RIGHT</small></button>
        </div>
        <div class="control-cluster action-controls">
          <button type="button" data-action="rotateCCW" aria-label="Rotate counterclockwise"><span>↶</span><small>ROTATE</small></button>
          <button type="button" data-action="hold" aria-label="Hold piece"><span>◇</span><small>HOLD</small></button>
          <button type="button" data-action="rotateCW" aria-label="Rotate clockwise"><span>↷</span><small>ROTATE</small></button>
          <button type="button" data-action="hard" class="drop-control" aria-label="Hard drop"><span>⇓</span><small>DROP</small></button>
        </div>
      </section>

      <footer><span>NO ADS</span><i></i><span>NO TRACKING</span><i></i><span>JUST BLOCKS</span></footer>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
